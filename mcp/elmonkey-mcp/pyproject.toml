[project]
name = "elmonkey-mcp"
version = "0.2.2"
description = "ELMonkey-MCP: ein Server, Add-ons je Quelle (Archicad, Kern) - Schwarz Architekturbuero"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "elmonkey-core"]

[tool.uv.sources]
elmonkey-core = { path = "../../core" }

[project.scripts]
elmonkey-mcp = "elmonkey_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmonkey_mcp"]
