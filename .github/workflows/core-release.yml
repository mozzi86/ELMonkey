name: Kern-Release (core-v*)

# Ein Tag core-vX.Y.Z testet den Kern und legt ein GitHub-Release an. Dessen Tarball
# (archive/refs/tags/core-vX.Y.Z.tar.gz#subdirectory=core) kann die Plattform fest pinnen.
on:
  push:
    tags: ['core-v*']

permissions:
  contents: write

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout löst annotierte Tags sonst zu leichten Tags auf — dann fehlte die Tag-Nachricht.
      - name: Annotierten Tag holen
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kern-Tests
        run: |
          pip install pytest
          cd core && python -m pytest -q tests

      - name: Version abgleichen
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#core-v}"
          pkg_version=$(sed -n 's/^version = "\(.*\)"/\1/p' core/pyproject.toml | head -n1)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu core/pyproject.toml (version = $pkg_version)"
            exit 1
          fi
          echo "VERSION=$pkg_version" >> "$GITHUB_ENV"

      # Wheel + sdist als Release-Dateien: bytegleich und mit Prüfsumme pinnbar (GitHub-Archive sind
      # nicht garantiert bytestabil). pip prüft ein #sha256=-Fragment, ohne den Hash-Zwang für alle
      # anderen Pakete einzuschalten.
      - name: Wheel und sdist bauen
        run: |
          set -euo pipefail
          pip install build
          python -m build core --outdir dist
          ls -l dist

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl | head -n1); NAME=$(basename "$WHL")
          SHA=$(sha256sum "$WHL" | cut -d' ' -f1)
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          {
            echo; echo "**Einbinden (fest, mit Prüfsumme):**"; echo
            echo '```'
            echo "elmonkey-core @ https://github.com/mozzi86/ELMonkey/releases/download/${GITHUB_REF_NAME}/${NAME}#sha256=${SHA}"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "elmonkey-core $VERSION" --notes-file notes.md --verify-tag dist/*
