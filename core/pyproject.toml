[project]
name = "elmonkey-core"
version = "0.2.0"
description = "ELMonkey-Kern: finden (und/oder/nicht), Vorprüfung mit Codes, Rücklese — neutral für Archicad und die Schwarz Plattform + Plattform-Klebe (elmonkey.plattform)"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elmonkey"]
